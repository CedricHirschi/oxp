<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-sensu d-sensu">
  <title id="t-sensu">SENS-U bladder-monitoring ultrasound patch</title>
  <desc id="d-sensu">Stylised illustration of the SENS-U wearable adhesive patch on the lower abdomen with four A-mode transducers and a downward ultrasound beam.</desc>
  <defs>
    <linearGradient id="skin" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fde2cf"/>
      <stop offset="1" stop-color="#f3c5a6"/>
    </linearGradient>
    <linearGradient id="patch" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fafcff"/>
      <stop offset="1" stop-color="#dfe7f0"/>
    </linearGradient>
    <linearGradient id="gel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#00629b" stop-opacity=".75"/>
      <stop offset="1" stop-color="#00629b" stop-opacity=".25"/>
    </linearGradient>
    <radialGradient id="beam" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00629b" stop-opacity=".55"/>
      <stop offset="1" stop-color="#00629b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="#eaf1f7"/>
  <!-- abdomen outline -->
  <path d="M120 320 Q400 60 680 320 L680 500 L120 500 Z" fill="url(#skin)" stroke="#cda287" stroke-width="2"/>
  <!-- ultrasound beam -->
  <g opacity=".9">
    <path d="M340 250 L460 250 L530 500 L270 500 Z" fill="url(#beam)"/>
    <path d="M340 250 L460 250 L500 500 L300 500 Z" fill="#00629b" fill-opacity=".12"/>
    <path d="M340 250 L460 250 L470 500 L330 500 Z" fill="#00629b" fill-opacity=".18"/>
  </g>
  <!-- adhesive patch base -->
  <rect x="300" y="220" width="200" height="80" rx="40" fill="url(#patch)" stroke="#aab8c7" stroke-width="2"/>
  <!-- coupling gel -->
  <ellipse cx="400" cy="260" rx="80" ry="14" fill="url(#gel)"/>
  <!-- 4 transducer elements -->
  <g fill="#1a2e40">
    <circle cx="358" cy="260" r="9"/>
    <circle cx="380" cy="260" r="9"/>
    <circle cx="420" cy="260" r="9"/>
    <circle cx="442" cy="260" r="9"/>
  </g>
  <!-- BLE icon -->
  <g transform="translate(620,150)" fill="#00629b">
    <path d="M0 0 L0 -20 L8 -10 Z"/>
    <circle r="6" cx="0" cy="-2" fill="#fff" stroke="#00629b" stroke-width="2"/>
  </g>
  <text x="640" y="156" font-family="Inter, Arial" font-size="16" fill="#00629b" font-weight="700">BLE</text>
  <!-- label -->
  <g font-family="Inter, Arial" fill="#1a2e40">
    <text x="400" y="395" font-size="34" font-weight="800" text-anchor="middle">SENS-U</text>
    <text x="400" y="425" font-size="16" text-anchor="middle" fill="#51677a">4-channel A-mode · adhesive patch · 55 g</text>
    <text x="400" y="455" font-size="14" text-anchor="middle" fill="#51677a">Continuous bladder-volume monitoring</text>
  </g>
</svg>
