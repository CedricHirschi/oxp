# GitHub Actions workflow to publish SIG WUS static site
# Serves files from the /docs directory on the main branch via GitHub Pages.
# The workflow copies the src/ contents into docs/ on each push to main.

name: Deploy static site

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Copy site files to docs
        run: |
          mkdir -p docs
          cp -r src/* docs/

      - name: Commit and push docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs
          git diff --quiet && echo "No changes to commit" && exit 0 || echo "Changes detected"
          git commit -m "Update docs from src via GitHub Actions"
          git push origin main
